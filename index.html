<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liceo Dashboard - Enrique Juárez</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #e7e9ea; font-family: 'Ubuntu', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 450px; padding-bottom: 40px; }
        
        .top-bar { border-bottom: 1px solid #2f3336; padding: 15px 0; margin-bottom: 20px; }
        .top-bar h1 { font-size: 20px; font-weight: 700; margin: 0; }

        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #71767b; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid #2f3336; color: #e7e9ea; padding: 12px; border-radius: 8px; font-size: 16px; font-family: inherit; }
        input:focus, textarea:focus { border-color: #1d9bf0; outline: none; }
        
        .quick-actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-pill { background: #1d9bf0; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .btn-pill.secondary { background: #2f3336; }
        
        .btn-post { width: 100%; background: #eff3f4; color: #0f1419; border: none; padding: 16px; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar"><h1>Nueva Planificación</h1></div>

    <form id="claseForm">
        <div class="input-group">
            <label>Docente</label>
            <input type="text" id="docente" value="Enrique Juárez">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 5px;">
            <div class="input-group" style="flex: 1.2; margin-bottom: 0;">
                <label>Grado</label>
                <select id="grado">
                    <option value="Primero">1° Grado</option>
                    <option value="Segundo">2° Grado</option>
                    <option value="Tercero">3° Grado</option>
                    <option value="Cuarto" selected>4° Grado</option>
                    <option value="Quinto">5° Grado</option>
                    <option value="Sexto">6° Grado</option>
                    <option value="Séptimo">7° Grado</option>
                    <option value="Octavo">8° Grado</option>
                    <option value="Noveno">9° Grado</option>
                </select>
            </div>
            <div class="input-group" style="flex: 1.8; margin-bottom: 0;">
                <label>Asignatura</label>
                <input type="text" id="asignatura" value="Informática">
            </div>
        </div>

        <div class="input-group" style="margin-top: 5px;">
            <label>Materias Rápidas</label>
            <div class="quick-actions">
                <button type="button" class="btn-pill secondary" onclick="v('asignatura','Matemática')">Mate</button>
                <button type="button" class="btn-pill secondary" onclick="v('asignatura','Informática')">Info</button>
                <button type="button" class="btn-pill secondary" onclick="v('asignatura','Inglés')">Inglés</button>
                <button type="button" class="btn-pill secondary" onclick="v('asignatura','Moral')">Moral</button>
                <button type="button" class="btn-pill secondary" onclick="v('asignatura','Formación Cristiana')">Formación Cristiana</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>N° de Clase</label>
                <input type="number" id="numClase" value="1" min="1">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>Fecha Manual / Automática</label>
                <input type="text" id="fecha">
            </div>
        </div>

        <div class="input-group">
            <label>Tema de la Clase</label>
            <input type="text" id="tema" placeholder="EJ: PARTES DE LA COMPUTADORA">
        </div>

        <div class="input-group">
            <label>Desarrollo (ChatGPT)</label>
            <textarea id="desarrollo" rows="6" placeholder="Pega aquí el contenido de la clase..."></textarea>
        </div>

        <div class="input-group">
            <label>Tarea / Actividad</label>
            <textarea id="tarea" rows="2" placeholder="Ej: Dibujar el monitor en el cuaderno."></textarea>
        </div>

        <button type="button" class="btn-post" onclick="generarPDF()">Generar PDF Oficial</button>
    </form>
</div>

<script>
    // Carga inicial automática de la fecha actual
    const opciones = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('fecha').value = new Date().toLocaleDateString('es-ES', opciones);

    function v(id, val) { document.getElementById(id).value = val; }

    function generarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Conversión a formato corto para usar de forma estricta en el nombre del archivo
        const conversionCorto = {
            "Primero": "1°",
            "Segundo": "2°",
            "Tercero": "3°",
            "Cuarto": "4°",
            "Quinto": "5°",
            "Sexto": "6°",
            "Séptimo": "7°",
            "Octavo": "8°",
            "Noveno": "9°"
        };

        const gradoTextoCompleto = document.getElementById('grado').value;
        const gradoFormatoCorto = conversionCorto[gradoTextoCompleto] || "4°";

        const data = {
            docente: document.getElementById('docente').value,
            gradoPdf: gradoTextoCompleto,       
            gradoArchivo: gradoFormatoCorto,    
            asignatura: document.getElementById('asignatura').value,
            numClase: document.getElementById('numClase').value,
            tema: document.getElementById('tema').value.toUpperCase(),
            desarrollo: document.getElementById('desarrollo').value,
            tarea: document.getElementById('tarea').value,
            fecha: document.getElementById('fecha').value   
        };

        const img = new Image();
        img.src = 'logo.png'; 
        img.onload = () => build(doc, img, data);
        img.onerror = () => build(doc, null, data);
    }

    // Función modificada: Encabezado minimalista, cursivo y gris suave
    function agregarEncabezadoGrisSuave(doc, data) {
        // helvetica + oblique/italic para ese look medio cursivo elegante
        doc.setFont("helvetica", "oblique").setFontSize(10).setTextColor(180, 180, 180); // Gris muy suave
        
        // Muestra únicamente el Colegio y el Tema de la clase
        doc.text(`Liceo Francisco López Ramos  —  Tema: ${data.tema.substring(0, 45)}`, 15, 15);
        
        // Línea divisoria en un gris extra tenue
        doc.setDrawColor(220, 220, 220).setLineWidth(0.2).line(15, 18, 195, 18);
    }

    function build(doc, img, data) {
        // --- CABECERA OFICIAL DE LA PRIMERA PÁGINA ---
        if (img) doc.addImage(img, 'PNG', 15, 15, 35, 35);
        
        doc.setFont("helvetica", "bold").setFontSize(18).setTextColor(0, 38, 99); // Azul Oficial Liceo
        doc.text("Liceo Francisco López Ramos", 55, 25);
        
        doc.setFontSize(11).setFont("helvetica", "normal").setTextColor(0, 0, 0); 
        doc.text(`Docente: ${data.docente}`, 55, 33);
        doc.text(`Asignatura: ${data.asignatura}`, 55, 38); 
        doc.text(`Grado: ${data.gradoPdf}`, 55, 43); 
        doc.text(`Fecha: ${data.fecha}`, 55, 48);

        // Línea divisoria azul de la primera página
        doc.setDrawColor(0, 38, 99).setLineWidth(0.5).line(15, 55, 195, 55);

        // --- CUERPO ---
        let y = 65;
        doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(160, 0, 0); // Rojo para tema
        doc.text("TEMA: " + data.tema, 15, y);
        
        y += 12;
        doc.setFontSize(12).setTextColor(0, 0, 0).text("DESARROLLO DE CLASE:", 15, y);
        
        y += 8;
        doc.setFont("helvetica", "normal").setFontSize(11).setTextColor(0, 0, 0);
        
        const lineas = doc.splitTextToSize(data.desarrollo, 175);
        lineas.forEach(l => {
            if (y > 270) { 
                doc.addPage(); 
                agregarEncabezadoGrisSuave(doc, data); // Llama al nuevo estilo suave y cursivo
                y = 28; // Margen optimizado para no chocar con la línea tenue superior
                doc.setFont("helvetica", "normal").setFontSize(11).setTextColor(0, 0, 0);
            }
            doc.text(l, 15, y); 
            y += 6.5;
        });

        // --- APARTADO DE TAREAS ---
        if (data.tarea) {
            y += 10;
            if (y > 270) { 
                doc.addPage(); 
                agregarEncabezadoGrisSuave(doc, data);
                y = 28; 
            }
            
            doc.setFont("helvetica", "bold").setFontSize(11).setTextColor(0, 38, 99); // Encabezado de Tarea en Azul
            doc.text("TAREA / ACTIVIDAD:", 15, y);
            
            y += 7;
            doc.setFont("helvetica", "normal").setFontSize(11).setTextColor(0, 0, 0);
            
            const tLineas = doc.splitTextToSize(data.tarea, 175);
            tLineas.forEach(l => { 
                if (y > 270) { 
                    doc.addPage(); 
                    agregarEncabezadoGrisSuave(doc, data);
                    y = 28; 
                    doc.setFont("helvetica", "normal").setFontSize(11).setTextColor(0, 0, 0);
                }
                doc.text(l, 15, y); 
                y += 6.5; 
            });
        }

        // Estructura de nombre exacta: (Clase X) [TEMA] - fecha - 9°.pdf
        const nombreArchivo = `(Clase ${data.numClase}) ${data.tema} - ${data.fecha} - ${data.gradoArchivo}.pdf`;
        doc.save(nombreArchivo);
    }
</script>
</body>
</html>
